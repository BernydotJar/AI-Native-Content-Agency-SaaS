[metadata]
name = agency-runtime
version = 0.4.0
description = Deterministic sandbox runtime for an eight-agent content agency

[options]
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    fastapi>=0.115,<1
    uvicorn[standard]>=0.30,<1

[options.packages.find]
where = .

[options.package_data]
agency_runtime =
    py.typed
    flow_manifest.json

[options.entry_points]
console_scripts =
    agency-runtime = agency_runtime.cli:entrypoint
    agency-api = agency_runtime.api:run
