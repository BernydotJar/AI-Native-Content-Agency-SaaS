[metadata]
name = agency-runtime
version = 0.1.0
description = Deterministic sandbox runtime for an eight-agent content agency

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = .

[options.package_data]
agency_runtime =
    py.typed
    flow_manifest.json

[options.entry_points]
console_scripts =
    agency-runtime = agency_runtime.cli:entrypoint
