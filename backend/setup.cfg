[metadata]
name = agency-runtime
version = 0.7.0
description = Deterministic sandbox runtime for an eight-agent content agency
license = MIT

[options]
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    fastapi>=0.115,<1
    httpx>=0.28,<1
    pg8000>=1.31.5,<2
    uvicorn[standard]>=0.30,<1

[options.packages.find]
where = .

[options.package_data]
agency_runtime =
    py.typed
    flow_manifest.json
    integration_reviews/*.json

[options.entry_points]
console_scripts =
    agency-runtime = agency_runtime.cli:entrypoint
    agency-api = agency_runtime.api:run
    agency-runtime-schema = agency_runtime.postgres_schema:main
