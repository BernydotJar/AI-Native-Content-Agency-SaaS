[build-system]
requires = ["setuptools>=58", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-runtime"
version = "0.2.0"
description = "Versioned control plane and deterministic sandbox runtime for an eight-agent content agency"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
agency-runtime = "agency_runtime.cli:entrypoint"
agency-control-plane = "control_plane.api:entrypoint"
agency-export-openapi = "control_plane.openapi:entrypoint"

[dependency-groups]
dev = [
  "httpx2>=2.7,<3",
  "mypy>=1.15,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agency_runtime*", "control_plane*"]

[tool.setuptools.package-data]
agency_runtime = ["py.typed", "flow_manifest.json"]
control_plane = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning",
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]

[tool.mypy]
# Type-check against the pinned production and CI runtime. Resolving the
# Type-check against the pinned production and CI runtime so typed third-party
# packages and application code are analyzed under the same interpreter contract.
python_version = "3.13"
packages = ["control_plane"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["agency_runtime", "agency_runtime.*"]
follow_imports = "skip"
ignore_errors = true
