name: production-readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - run: ./scripts/install-actionlint.sh
      - run: |
          "$HOME/.local/bin/actionlint" .github/workflows/*.yml
      - run: python3 scripts/verify-gcp-image-workflow.py

  python-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-build.lock
      - run: ./scripts/check-python-locks.sh

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:program
      - run: npm run validate:graph
      - run: npm run validate:governance
      - run: npm run validate:compliance
      - run: npm run validate:operability
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Verify browser accessibility contracts
        run: |
          BROWSER_BIN="$(command -v chromium || command -v google-chrome || command -v google-chrome-stable)"
          test -n "$BROWSER_BIN"
          CHROMIUM_BIN="$BROWSER_BIN" npm run verify:accessibility-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: accessibility-evidence
          path: artifacts/accessibility/generated
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements-build.lock
            backend/requirements-test.lock
      - run: python -m pip install --require-hashes -r backend/requirements-build.lock
      - run: python -m pip install --require-hashes -r backend/requirements-test.lock
      - run: python -m build --no-isolation --wheel --outdir /tmp/agency-wheels backend
      - run: python -m pip install --no-deps /tmp/agency-wheels/*.whl
      - run: python -m pip check
      - run: npm run validate:semantic-evals
        env:
          SEMANTIC_EVAL_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload semantic evaluation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-evaluation-evidence
          path: artifacts/semantic-evals/generated
          if-no-files-found: error
          retention-days: 30
      - run: python -m unittest discover -s backend/tests -v
      - name: Verify political authority browser contracts
        run: |
          BROWSER_BIN="$(command -v chromium || command -v google-chrome || command -v google-chrome-stable)"
          test -n "$BROWSER_BIN"
          CHROMIUM_BIN="$BROWSER_BIN" POLITICAL_BROWSER_PYTHON=python POLITICAL_BROWSER_USE_INSTALLED=1 npm run verify:political-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: political-browser-evidence
          path: artifacts/political-browser/generated
          if-no-files-found: error
          retention-days: 30

  postgresql-shared-state:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-bookworm@sha256:b0c5bab0fbba8e0c221f73b1dc6359ec35f8650074377e727299df248fc8ad51
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements-build.lock
            backend/requirements-test.lock
      - run: ./scripts/verify-postgresql-runtime.sh
        env:
          AGENCY_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: ai-native-content-agency:ci


  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: ./scripts/install-supply-chain-tools.sh
      - run: CONTAINER_BUILDER=docker ./scripts/verify-supply-chain.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: supply-chain-evidence
          path: artifacts/supply-chain/generated
          if-no-files-found: warn
          retention-days: 30

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.2.0
      - run: helm lint infra/helm/ai-native-content-agency
      - run: helm template agency infra/helm/ai-native-content-agency > /tmp/rendered.yaml

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/gcp fmt -check -recursive
      - run: terraform -chdir=infra/gcp init -backend=false
      - run: terraform -chdir=infra/gcp validate
      - run: terraform -chdir=infra/gcp test
