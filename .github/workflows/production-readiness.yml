name: production-readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-build.lock
      - run: ./scripts/check-python-locks.sh

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-build.lock
            backend/requirements-test.lock
      - run: python -m pip install --require-hashes -r backend/requirements-build.lock
      - run: python -m pip install --require-hashes -r backend/requirements-test.lock
      - run: python -m build --no-isolation --wheel --outdir /tmp/agency-wheels backend
      - run: python -m pip install --no-deps /tmp/agency-wheels/*.whl
      - run: python -m pip check
      - run: python -m unittest discover -s backend/tests -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-native-content-agency:ci

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint infra/helm/ai-native-content-agency
      - run: helm template agency infra/helm/ai-native-content-agency > /tmp/rendered.yaml

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
