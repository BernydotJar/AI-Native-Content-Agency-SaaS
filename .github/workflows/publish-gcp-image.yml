name: publish-gcp-image

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish the current main commit as an immutable GCP image
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-gcp-image-main
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ai-native-content-agency-saas
  GCP_REGION: us-central1
  GAR_REPOSITORY: campaignos
  IMAGE_NAME: campaignos
  IMAGE_URI: us-central1-docker.pkg.dev/ai-native-content-agency-saas/campaignos/campaignos

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm_publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - id: auth
        name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ai-native-content-agency-saas
          workload_identity_provider: projects/970393454298/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: campaignos-deployer@ai-native-content-agency-saas.iam.gserviceaccount.com
          create_credentials_file: true
          cleanup_credentials: true
          request_reason: github-actions:${{ github.repository }}:${{ github.run_id }}

      - name: Set up pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 578.0.0
          project_id: ai-native-content-agency-saas

      - name: Configure Docker authentication for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: build
        name: Build and publish immutable linux-amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_URI }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify and record immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published image digest is missing or malformed" >&2
            exit 1
          fi
          {
            echo "## GCP image published"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Image: \`${IMAGE_URI}@${IMAGE_DIGEST}\`"
            echo "- Cloud Run deployment: not performed"
          } >> "$GITHUB_STEP_SUMMARY"
