name: media-video-quality-lab

on:
  pull_request:
    paths:
      - "scripts/media-lab/**"
      - "docs/media-lab/**"
      - ".github/workflows/media-video-quality-lab.yml"
  push:
    branches: [main]
    paths:
      - "scripts/media-lab/**"
      - "docs/media-lab/**"
      - ".github/workflows/media-video-quality-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-media-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check zero-cost local toolchain
        run: |
          command -v ffmpeg
          command -v ffprobe
          python -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.0.0
      - name: Validate two procedural storyboards and media QA
        run: |
          PYTHON_BIN=python bash scripts/media-lab/run_quality_gate.sh
      - name: Confirm no generated videos are committed
        run: |
          test -z "$(git ls-files artifacts/media-lab/generated)"
          git diff --exit-code
