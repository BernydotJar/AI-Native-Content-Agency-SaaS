name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build, lint, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.4.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Verify frontend API contract mapping
        run: npm run check:api-contract
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  backend:
    name: Backend, migrations, OpenAPI, and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15.13-alpine3.22@sha256:1414298ea93186123a6dcf872f778ba3bd2347edcbd2f31aa7bb2d9814ff5393
        env:
          POSTGRES_DB: agency
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_USER: agency
        options: >-
          --health-cmd "pg_isready -U agency -d agency"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: scripts/requirements-ci.lock
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r scripts/requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e backend
      - name: Lint Python
        run: |
          ruff check backend scripts --config backend/pyproject.toml
          ruff format --check backend scripts --config backend/pyproject.toml
      - name: Type-check control plane
        run: mypy --config-file backend/pyproject.toml backend/control_plane
      - name: Run Python tests
        run: pytest -c backend/pyproject.toml backend/tests
      - name: Apply migrations to PostgreSQL
        env:
          AGENCY_DATABASE_URL: postgresql+psycopg://agency:ci-postgres-only@127.0.0.1:5432/agency
        run: alembic -c backend/alembic.ini upgrade head
      - name: Reject model and migration drift
        env:
          AGENCY_DATABASE_URL: postgresql+psycopg://agency:ci-postgres-only@127.0.0.1:5432/agency
        run: alembic -c backend/alembic.ini check
      - name: Verify PostgreSQL API integration
        env:
          AGENCY_DATABASE_URL: postgresql+psycopg://agency:ci-postgres-only@127.0.0.1:5432/agency
        run: python scripts/postgres_integration.py
      - name: Verify OpenAPI snapshot
        run: agency-export-openapi --output backend/openapi.json --check

  platform:
    name: Terraform, Compose, container, and platform evals
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The canonical result commit must be able to prove its source parent.
          fetch-depth: 2
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: scripts/requirements-ci.lock
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.4.1
          cache: npm
      - name: Install platform validation dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r scripts/requirements-ci.lock
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the locked Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run Terraform and static platform gates
        run: scripts/validate_platform.sh
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the deterministic non-root image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: ai-native-content-agency:ci
          target: runtime
          provenance: false
      - name: Verify runtime user
        run: test "$(docker image inspect ai-native-content-agency:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Verify Compose migrations and same-origin HTTP flow
        env:
          COMPOSE_PROJECT_NAME: agency-e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_RESTART_PERSISTENCE: "1"
          IMAGE_TAG: ci
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          POSTGRES_PASSWORD: ci-compose-only
        run: |
          cleanup() {
            docker compose down --remove-orphans --volumes
          }
          trap cleanup EXIT
          cleanup
          docker compose up --detach --wait --no-build
          python scripts/http_smoke.py --base-url http://127.0.0.1:8080
          npm run test:e2e

  security:
    name: Dependency, secret, and repository integrity gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.4.1
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: scripts/requirements-ci.lock
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes --no-deps -r scripts/requirements-ci.lock
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: Audit Python runtime and CI dependencies
        run: |
          pip-audit --require-hashes -r scripts/requirements-container.lock
          pip-audit --require-hashes -r scripts/requirements-ci.lock
      - name: Scan platform policy
        run: python scripts/platform_eval.py
      - name: Scan the repository and Git history for secrets and personal paths
        run: |
          python -m unittest scripts.test_eval_harness scripts.test_governance_eval scripts.test_repository_integrity scripts.test_http_smoke
          python scripts/repository_integrity.py
          python -m scripts.governance_eval
          python scripts/eval_harness.py --check-results agent/eval-results.json
      - name: Check whitespace across the complete tracked tree
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
