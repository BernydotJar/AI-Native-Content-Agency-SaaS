# SQLite is the current durable store. Keep one replica until a shared database
# adapter (for example PostgreSQL) replaces the single-writer runtime.
replicaCount: 1

image:
  repository: ai-native-content-agency
  tag: local
  pullPolicy: IfNotPresent

runtime:
  databasePath: "/var/lib/agency/runtime.sqlite3"
  auth:
    existingSecret: "ai-native-content-agency-runtime"
    tenantApiKeysKey: "tenant-api-keys.json"
  session:
    cookieName: "agency_session"
    cookieSecure: true
    ttlSeconds: 28800

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClassName: ""

observability:
  metrics:
    enabled: true
    path: "/metrics"
    port: "8080"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podDisruptionBudget:
  # A PDB cannot create availability for a single SQLite writer. Enable after
  # moving to a shared store and increasing replicaCount.
  enabled: false
  minAvailable: 1
